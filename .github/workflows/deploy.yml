name: Deploy to IONOS

# Statisches Deployment der TanStack-Start-Seite auf IONOS Webhosting.
# Build -> Prerender (statisches HTML) -> Upload via SFTP (Passwort-Auth).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ionos
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Prerender static HTML
        run: bun scripts/prerender.mjs

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload via SFTP (mirror, überschreibt & löscht verwaiste Dateien)
        env:
          IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          IONOS_SFTP_PASS: ${{ secrets.IONOS_SFTP_PASS }}
        run: |
          lftp -u "$IONOS_SFTP_USER","$IONOS_SFTP_PASS" sftp://$IONOS_SFTP_HOST -e "
            set sftp:auto-confirm yes;
            set mirror:use-pget-n 1;
            mirror -R --delete --verbose --parallel=2 ./.output/public /holzbau-scharpf;
            quit
          "
