name: Deploy to IONOS

# Statisches Deployment der TanStack-Start-Seite auf IONOS Webhosting.
# Build -> Prerender (statisches HTML) -> Upload via SFTP (Passwort-Auth).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ionos
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download all referenced Lovable media for IONOS
        run: bun scripts/fetch-lovable-assets.mjs https://delightful-hero-lab.lovable.app

      - name: Build
        run: bun run build

      - name: Prerender static HTML
        run: bun scripts/prerender.mjs

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload via SFTP (mirror, überschreibt & löscht verwaiste Dateien)
        env:
          IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          IONOS_SFTP_PASS: ${{ secrets.IONOS_SFTP_PASS }}
        run: |
          lftp -u "$IONOS_SFTP_USER","$IONOS_SFTP_PASS" sftp://$IONOS_SFTP_HOST -e "
            set sftp:auto-confirm yes;
            set mirror:use-pget-n 1;
            mirror -R --delete --verbose --parallel=2 ./.output/public /holzbau-scharpf;
            quit
          "

      - name: Verify service tile images on IONOS
        run: |
          curl --fail --retry 5 --retry-all-errors --retry-delay 10 --output /tmp/fassade.jpg "https://holzbau-scharpf.de/__l5e/assets-v1/314900a0-fa9b-4e15-95b5-9b260f00a7d3/scharpf_leistungen_fassade.jpg"
          curl --fail --retry 5 --retry-all-errors --retry-delay 10 --output /tmp/ladekran.png "https://holzbau-scharpf.de/__l5e/assets-v1/daedcf03-1d68-46fb-ad0d-6074977bb52c/scharpf_leistungen_ladekran.png"
          file --mime-type /tmp/fassade.jpg | grep 'image/jpeg'
          file --mime-type /tmp/ladekran.png | grep 'image/png'
